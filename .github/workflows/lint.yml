name: Lint data

# Fast PR feedback for data contributions (override lines, corrections,
# spot-panel rows, fetch-manifest edits) and for the published export
# contract (EXPORT_FORMATS.md, export-contract.json, conformance fixtures).
# Stdlib-only, no secrets, no pipeline checkout — the authoritative
# validation still happens inside every nightly build (nightly-build.yml).
# The export step deliberately installs no Python, Go, or SQLite tooling:
# a spec/fixture PR must not wait on an exporter toolchain.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4 targeted deprecated Node 20 (see nightly-build.yml maintainer notes)

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Lint curated data files
        run: ruby scripts/lint_overrides.rb

      - name: Validate the export contract and conformance fixtures
        run: ruby scripts/lint_export_contract.rb
