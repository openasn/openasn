  source_url: "https://www.adhesivesresearch.com/"
  date: 2026-07-07
# ============================ Sweep 2026-09-05 (M1) ============================
# 16 upstream category errors on LARGE CONSUMER NETWORKS. ipverse as-metadata labels each of
# these `hosting` or `business`; every one is a retail broadband or mobile operator, so today
# OpenASN answers ":hosting" or ":business" for roughly 180 million people's home and phone traffic.
#
# METHOD. Candidates came from ranking every routed ASN by APNIC estimated end users and keeping
# those NOT categorized `isp` (252 ASNs) — the population where an upstream category error costs
# the most. Opus researchers worked the list per record (RDAP, the operator's own site, Wikipedia,
# the national regulator, and reverse DNS on addresses inside announced prefixes). The manager then
# INDEPENDENTLY re-checked the identity of every ASN below against the RIR's RDAP registrant before
# writing it here, and the registrant name appears in each `reason`. Only ASNs that survived both
# passes are in this file; the sweep's remaining candidates are held for a second adversarial pass
# rather than shipped on one researcher's word.
#
# WHY `category` ONLY, NEVER `network_role`. ipverse derives networkRole from position in the
# routing graph, which is a DIFFERENT claim from "what kind of network is this", and it is usually
# right: MTN Nigeria genuinely is a midsize transit provider as well as an access network. It also
# cannot change the verdict (category isp + any role except tier1_transit -> :residential_isp).
# Correcting only what we verified keeps every entry minimal and reviewable.
#
# KNOWN LIMITATION — READ THIS BEFORE TRUSTING THE TOP TWO. AS29465 (MTN Nigeria) and AS36873
# (Airtel Nigeria) will STILL classify :hosting after this correction, because both are also stale
# false positives in brianhama/bad-asn-list: pipeline/compile.rb ORs FLAG_BAD_ASN on AFTER this
# file is applied, and pipeline/lib/classifier.rb ranks that flag above every category. Nothing in
# data/overrides/ can currently override an upstream infrastructure list. The corrections are
# recorded anyway because they are true and they pre-position the fix; making them effective needs
# the upstream removal and/or a pipeline change letting curated eyeball evidence suppress the flag.

