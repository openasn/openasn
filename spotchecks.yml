# The spot-check panel: known IPs with expected verdicts, asserted on every
# build (pipeline/validate.rb gate G5) and in the gem's test suite.
#
# THIS IS A TRIPWIRE, NOT GOSPEL. Routing changes; providers move blocks.
# When a row fails: verify what actually changed (rake 'lookup[IP]'), then
# either fix the pipeline bug it caught, or update the row in a reviewed PR
# whose description says WHY the internet changed. Never bulk-update rows to
# make CI green.
#
# Row fields:
#   ip:      the probe
#   expect:  verdict (Tier A canonical semantics - no Tier B overlays here)
#   rule:    optional - assert WHICH precedence rule fired (catches "right
#            answer, wrong path" regressions, e.g. Cloudflare must classify
#            via as-metadata category, NOT via the X4B dc overlay, because
#            X4B deliberately excludes Cloudflare ranges)
#   gem_sources: optional - the SAME winning rule as it appears in a client's
#            `Result#sources` LIST. Three rules are named differently by the
#            pipeline validator and the gem (pipeline `asn_mobile`,
#            `no_category`, and `asn_category` for flag-driven hosting, versus
#            the gem's `asn_mobile_carrier`, `asn_no_category`,
#            `asn_bad_asn`/`asn_hosting_extra`/`asn_cdn`), and the gem returns
#            a LIST where the pipeline returns one symbol. `rule:` is the
#            pipeline's name and is what gate G5 asserts; `gem_sources:` is
#            what the gem, Python and JS clients must return. See CONFORMANCE.md.
#   tier_b / provider / context_flags: optional, `context: gem` rows only -
#            the Tier B source id expected to win, the provider attribution it
#            must carry, and any context flags. Asserted by the clients with a
#            fixture overlay for that source id; the pipeline skips these rows.
#   asn:     optional - assert the announcing ASN
#   context: "gem" rows are skipped by the pipeline (they need Tier B
#            overlays that only exist client-side)
#   note:    for humans
#
# `rule:` is asserted only where the PATH is structural - a change there means
# a real semantic change (specials, category-driven verdicts, override flags,
# transit ambiguity, no-category, unrouted). It is deliberately NOT asserted on
# rows that win through the canonical X4B range overlays (x4b_dc / x4b_vpn) or
# through flag-driven hosting, because those lists are re-published upstream
# nightly: the verdict is the contract, the path through two interchangeable
# hosting signals is not, and asserting it would fail builds on non-events.
# Three rows opt back in because the path IS the point (Cloudflare must not
# come from the dc overlay; the hosting_extra override must be what makes
# vsys.host hosting; Host Europe shows the same override losing to rule 9 -
# by design).
#
# Panel v2 (2026-09-12): 20 -> 81 Tier A rows. Every row's expect/rule/asn/
# gem_sources was GENERATED from a real classification of the build
# 2026-09-12T01:20:54Z (OFFLINE pipeline run over a cache fetched the same
# hour), never hand-written, so no row can claim a verdict the artifacts do
# not produce. Probes are chosen deterministically: the ASN's largest
# announced range, +10 addresses, so a probe never sits on a range edge where
# a more-specific could silently swallow it. Coverage: every reachable rule of
# the Tier A ladder, at least one real IP per data/overrides/ file, both
# address families for every verdict class that has v6 space, and the CGNAT /
# RFC1918 / class-E boundaries in adjacent pairs.
#
# Panel history: 81.9.5.10 expected :unknown in the founding spec (from the Feb-2026
# prototype, whose logic had no :business verdict); ipverse now categorizes
# AS20597 (Vimpelcom) as business/stub, so the correct §9 verdict is
# :business via rule 13. Updated 2026-07-04 at implementation time.
#
# Panel history: the Vodafone DE probe was 95.90.200.10 (AS3209) until
# 2026-08-08. Vodafone is re-homing ex-Kabel-Deutschland cable /23s from
# VODANET AS3209 to KABELDEUTSCHLAND-AS AS31334 (both "Vodafone GmbH", both
# German residential; AS31334 is a stub customer of AS3209): the nightly saw
# AS31334 from 2026-07-16, flapped back to AS3209 for one night (2026-07-24),
# then AS31334 again from 2026-07-25 on. A probe on a live migration boundary
# is noise, not signal, so it moved to 2.201.10.10 in the ex-Arcor DSL pool
# 2.200.0.0/13 - same ASN, same verdict, same German-residential intent, but
# announced whole by AS3209 (stable, 320+ RIS full-feed peers, zero AS31334
# more-specifics even at min_peers_seeing=1).

