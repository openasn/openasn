name: Build & publish data

# The nightly data build. Lives in THIS repo (not the pipeline repo) on
# purpose: releases publish here, so the repo's own GITHUB_TOKEN is enough
# to upload assets — and once openasn-pipeline is public, the whole nightly
# needs zero secrets.
#
# While openasn-pipeline is PRIVATE, checking it out needs one secret:
#   PIPELINE_REPO_TOKEN — a PAT that can READ openasn/openasn-pipeline
#   (fine-grained: Repository access = openasn-pipeline, Contents: Read;
#   classic `repo` scope also works if org settings block fine-grained).
#   Add it under Settings → Secrets and variables → Actions.
# When the pipeline repo goes public, delete the secret; the fallback to
# github.token takes over automatically.
#
# Maintainer notes:
#   * Cron minute is deliberately off-hour (03:17 UTC): GitHub delays
#     on-the-hour crons under load, and upstreams appreciate the jitter.
#   * jq is preinstalled on ubuntu runners; the as.json parser uses it.
#   * Action majors (checkout v7 / cache v6 / upload-artifact v7) run on
#     Node 24; the previously pinned v4s targeted Node 20, deprecated:
#     https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
#     They need runner >= 2.327.1 - GitHub-hosted ubuntu-latest is always
#     newer; only a concern if this ever moves to self-hosted runners.
#   * On gate failure a `pipeline-failure` issue is opened/updated here so
#     a broken nightly is impossible to miss (license drift, delta trips,
#     upstream URL scheme changes — sapics changed theirs 2026-06-18).
#   * UNBLOCKING A DRIFT FAIL (DECISIONS.md D-GATE-1): when a drift gate
#     fails on a move you have verified is genuine upstream reality, run
#     this workflow from the Actions tab with the `ack_drift` input set to
#     the REASON (a sentence with evidence, e.g. an upstream commit URL).
#     That downgrades the drift FAIL to a loud WARN for that one run and
#     stamps the reason into manifest.json (`stats.drift_ack`), so the
#     override is on the public record forever. It does NOT disable the
#     absolute floors (MIN_HOSTING_ASNS, size bounds, spot panel).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dated_tag:
        description: "Also cut a dated pinnable release (vYYYY.MM.DD)"
        type: boolean
        default: false
      ack_drift:
        description: "Acknowledge a drift-gate FAIL for THIS run: the reason (with evidence) is stamped into manifest.json. Leave empty for a normal build."
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "data/**"
      - "spotchecks.yml"
      - "fetch-manifest.json"
      - ".github/workflows/nightly-build.yml"
  pull_request:
    paths:
      - "data/**"
      - "spotchecks.yml"
      - "fetch-manifest.json"

concurrency:
  group: data-build
  cancel-in-progress: false # never kill a publish mid-upload

permissions:
  actions: write  # gh workflow enable needs this; unspecified permissions are not writable.
  contents: write # create/update releases in this repo
  issues: write   # open pipeline-failure issues

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout data repo (this repo)
        uses: actions/checkout@v7
        with:
          path: data-repo

      - name: Checkout pipeline
        uses: actions/checkout@v7
        with:
          repository: openasn/openasn-pipeline
          path: pipeline-repo
          # Secret needed only while openasn-pipeline is private (see header).
          token: ${{ secrets.PIPELINE_REPO_TOKEN || github.token }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # GitHub auto-disables cron workflows in public repos after 60 days
      # WITHOUT COMMITS — and a healthy data repo is exactly one that can
      # go quiet between curation PRs while the nightly hums along. The
      # documented reset is re-enabling the workflow via API, which counts
      # as workflow activity. Run this BEFORE the pipeline so even a gate
      # failure still resets the schedule's inactivity timer.
      - name: Keep the schedule alive through commit-quiet periods
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable nightly-build.yml --repo ${{ github.repository }} || true

      # Upstream downloads are cached between runs so conditional GETs
      # (ETag) can 304 and we stay polite to third-party mirrors.
      - name: Restore upstream download cache
        uses: actions/cache@v6
        with:
          path: pipeline-repo/build/cache
          key: upstream-cache-${{ github.run_id }}
          restore-keys: upstream-cache-

      - name: Run pipeline (fetch → gates → compile → validate → publish)
        env:
          OPENASN_DATA_REPO: ${{ github.workspace }}/data-repo
          # Publish only on scheduled runs and manual dispatch — never from
          # PRs or ordinary pushes (those validate only).
          PUBLISH: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
          OPENASN_DATED_TAG: ${{ inputs.dated_tag == true && '1' || '' }}
          # Empty on every scheduled run. Set only from the workflow_dispatch
          # `ack_drift` input, and only for that one run: it downgrades a
          # drift-gate FAIL to a loud WARN and stamps the reason into
          # manifest.json stats.drift_ack (DECISIONS.md D-GATE-1).
          OPENASN_ACK_DRIFT: ${{ inputs.ack_drift }}
          GH_TOKEN: ${{ github.token }}
        working-directory: pipeline-repo
        run: |
          # Weekly pinnable snapshot: Sundays on the scheduled run. These
          # dated pins are also the drift gate's long-run baseline (they are
          # frozen, so they survive a publish outage) — do not stop cutting
          # them without reading D-GATE-1 first.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "7" ]; then
            export OPENASN_DATED_TAG=1
          fi
          # Tee the log so the failure step below can quote the gate that
          # actually tripped into the issue, instead of guessing at causes.
          set -o pipefail
          ruby pipeline/run.rb 2>&1 | tee "$GITHUB_WORKSPACE/pipeline.log"

      # Mirror the freshly published artifacts to the HuggingFace dataset
      # (https://huggingface.co/datasets/openasn/openasn — CSV backs the
      # dataset viewer). NON-FATAL by design: HF_TOKEN is an OAuth token
      # that can expire — a dead token must never block the nightly release.
      # To restore: create a WRITE token at huggingface.co/settings/tokens
      # (scope: openasn datasets) and `gh secret set HF_TOKEN`.
      - name: Mirror release to HuggingFace
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "no HF_TOKEN — skipping mirror"; exit 0; fi
          pip install -q "huggingface_hub[cli]" 2>/dev/null || pipx install huggingface_hub 2>/dev/null || true
          bash pipeline-repo/huggingface/push.sh || echo "::warning::HF mirror failed (release itself is fine) — check/replace HF_TOKEN"

      - name: Upload artifacts for inspection (PR/push builds)
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: openasn-dist
          path: pipeline-repo/build/dist/
          retention-days: 7
          if-no-files-found: ignore

      # A failed nightly must page a human. Reuses one open issue instead
      # of spamming a new one per failure night. Every message quotes the
      # gate lines from the run itself: the 2026-08/09 deadlock ran for 12
      # nights partly because each "Failed again" comment was a bare URL,
      # so the repeat *shape* of the failure was invisible from the issue.
      #
      # Every gh call carries -R: this step runs at the workspace ROOT,
      # which is not a git repo (the checkouts live in data-repo/ and
      # pipeline-repo/), so without -R gh tries to resolve the repo from
      # git remotes and dies with "failed to run git: fatal: not a git
      # repository" - which is how this tripwire silently failed on every
      # red nightly from 2026-07-16 through 2026-08-08.
      - name: Open/update pipeline-failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The gate verdicts this run logged (one line each, with numbers).
          gates=$(grep -aE 'drift (PASS|WARN|FAIL|RECOVERY|ACKED|SKIP)|\[(ERROR|WARN)\]|^G[0-9]:' pipeline.log 2>/dev/null | tail -25 || true)
          [ -n "$gates" ] || gates="(no gate lines captured — the run failed before or outside the pipeline step)"
          {
            echo "The scheduled data build failed: $run_url"
            echo
            echo "Gate lines from this run:"
            echo '```'
            echo "$gates"
            echo '```'
          } > comment.md

          {
            cat comment.md
            cat <<'EOF'

          Most likely causes (see the job log for the gate that tripped):
          - Pipeline checkout: PIPELINE_REPO_TOKEN missing/expired (needed while openasn-pipeline is private)
          - License gate: an upstream changed its license text (data/licenses/ pins)
          - Delta gate (G4): a layer's record count moved more than ±20% overnight
          - Crosscheck drift: the ipverse hosting-ASN count moved more than 10% down / 20% up
          - An upstream URL scheme changed (sapics did this 2026-06-18)

          ### If a drift gate tripped

          A failed build publishes nothing, so the drift gate's day-over-day
          reference stops moving: if the *previous* build was the degraded one,
          every following night compares against that same bad number and fails
          identically. That is what happened 2026-08-25 → 2026-09-05 (12 nights).
          The gate now self-heals — a value back within ±5% of a weekly dated pin
          is logged as `drift RECOVERY` and PASSES — so check the gate lines above
          before assuming a real upstream problem.

          If the move is genuine upstream reality and you have verified it:
          re-run this workflow from the Actions tab (Run workflow) with the
          **`ack_drift`** input set to the reason, including evidence (e.g. the
          upstream commit URL). The drift FAIL becomes a loud WARN for that one
          run and the reason is stamped into `manifest.json` (`stats.drift_ack`)
          permanently. It does not disable the absolute floors, the size bounds,
          or the spot panel — those still have to be green.

          Background: DECISIONS.md → D-GATE-1.
          EOF
          } > body.md
          # `gh issue create --label` fails hard on a nonexistent label and
          # this repo starts with none; --force makes re-runs idempotent.
          gh label create pipeline-failure -R "$REPO" --color B60205 \
            --description "The nightly data build failed" --force
          # No `|| true` around the list: if it fails (auth, rate limit),
          # this step must fail LOUDLY - swallowing the error and falling
          # through to create was part of how the tripwire never fired.
          # `// empty` guards the empty-list case so a null result can't
          # satisfy the -n test and "comment" on issue "null".
          existing=$(gh issue list -R "$REPO" --label pipeline-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$REPO" --body-file comment.md
          else
            gh issue create -R "$REPO" --title "Nightly data build failed" --body-file body.md --label pipeline-failure
          fi
